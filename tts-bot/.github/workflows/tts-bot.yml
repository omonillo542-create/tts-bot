name: AI Ovoz Bot

# Bot GitHub Actions runner'ida doimiy ishlaydi (bepul, public repo).
# Har soat yangi run boshlanadi, eskisi bekor qilinadi (conflict bo'lmasligi uchun).
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: tts-bot
  cancel-in-progress: true

jobs:
  bot:
    name: Bot server
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        working-directory: repo/tts-bot
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Run bot
        working-directory: repo/tts-bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MIYYA_API_KEY: ${{ secrets.MIYYA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_THINKING_KEY: ${{ secrets.OPENROUTER_THINKING_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p tmp
          python bot.py
